<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loom — personal knowledge OS</title>
<meta name="description" content="A personal knowledge operating system: ingest sources, weave a knowledge graph, and recall what matters.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<header class="topbar">
  <a class="brand" href="#/graph" aria-label="Loom home">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M6 4v24M16 4v24M26 4v24" />
      <path d="M4 8h24M4 16h24M4 24h24" />
    </svg>
    <span class="brand-name">Loom</span>
    <span class="brand-sub">knowledge OS</span>
  </a>

  <nav class="nav" aria-label="Primary">
    <a href="#/graph" data-nav="graph">Graph</a>
    <a href="#/library" data-nav="library">Library</a>
    <a href="#/memory" data-nav="memory">Memory</a>
    <a href="#/ask" data-nav="ask">Ask</a>
    <a href="#/sources" data-nav="sources">Sources</a>
  </nav>

  <div class="topbar-right">
    <button class="search-trigger" id="search-trigger" type="button">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
      <span>Search everything</span>
      <kbd>⌘K</kbd>
    </button>
    <span class="llm-badge" id="llm-badge" title="Local model connection">
      <i class="dot"></i><span>checking</span>
    </span>
  </div>
</header>

<main id="view" class="view" tabindex="-1"></main>

<div class="palette" id="palette" hidden>
  <div class="palette-backdrop" data-close-palette></div>
  <div class="palette-box" role="dialog" aria-modal="true" aria-label="Search">
    <div class="palette-input">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
      <input id="palette-input" type="text" placeholder="Search passages, entities, documents…" autocomplete="off" spellcheck="false">
      <kbd>esc</kbd>
    </div>
    <div class="palette-results" id="palette-results"></div>
    <div class="palette-foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
      <span><kbd>↵</kbd> open</span>
      <span class="palette-hint">Hybrid BM25 + vector search</span>
    </div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
